[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "candidate-transformer"
version = "0.1.0"
description = "Semantic Guided Candidate Transformer foundation"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Eightfold AI Internship" }]
dependencies = [
  "pydantic>=2.8.0,<3.0.0",
  "PyYAML>=6.0.1,<7.0.0",
  "rapidfuzz>=3.9.0,<4.0.0",
  "phonenumbers>=8.13.40,<9.0.0",
  "dateparser>=1.2.0,<2.0.0",
  "pdfplumber>=0.11.0,<1.0.0",
  "python-docx>=1.1.2,<2.0.0",
  "spacy>=3.7.5,<4.0.0",
  "typing_extensions>=4.12.2,<5.0.0"
]

[tool.setuptools]
packages = [
  "src",
  "src.core",
  "src.models",
  "src.adapters",
  "src.semantic",
  "src.fusion",
  "src.projection",
  "src.validation",
  "src.confidence",
  "src.provenance",
  "src.ontology",
  "src.config",
  "src.utils",
  "src.interfaces"
]
