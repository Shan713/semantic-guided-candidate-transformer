mode: default
output_schema_name: assignment_default
output_schema_version: "1.0"
include_provenance: true
include_confidence: true
missing_value_strategy: null
strict_unmapped_target_fields: true
freeze_canonical_input: true
emit_validation_errors: true
rules:
  - rule_id: map_candidate_id
    source_path: candidate_id
    target_path: candidate_id
    operation: select
    required: true
    enabled: true
  - rule_id: map_full_name
    source_path: full_name
    target_path: full_name
    operation: select
    required: false
    enabled: true
  - rule_id: map_emails
    source_path: emails
    target_path: emails
    operation: remap
    required: true
    enabled: true
  - rule_id: map_phones
    source_path: phones
    target_path: phones
    operation: remap
    required: true
    enabled: true
  - rule_id: map_location
    source_path: location
    target_path: location
    operation: nest
    required: false
    enabled: true
  - rule_id: map_links
    source_path: links
    target_path: links
    operation: nest
    required: false
    enabled: true
  - rule_id: map_headline
    source_path: headline
    target_path: headline
    operation: select
    required: false
    enabled: true
  - rule_id: map_years_experience
    source_path: years_experience
    target_path: years_experience
    operation: select
    required: false
    enabled: true
  - rule_id: map_skills
    source_path: skills
    target_path: skills
    operation: remap
    required: true
    enabled: true
  - rule_id: map_experience
    source_path: experience
    target_path: experience
    operation: remap
    required: false
    enabled: true
  - rule_id: map_education
    source_path: education
    target_path: education
    operation: remap
    required: false
    enabled: true
  - rule_id: map_provenance
    source_path: provenance
    target_path: provenance
    operation: remap
    required: false
    enabled: true
  - rule_id: map_overall_confidence
    source_path: overall_confidence_internal
    target_path: overall_confidence
    operation: rename
    required: false
    enabled: true
