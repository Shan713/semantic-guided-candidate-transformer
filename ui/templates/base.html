<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SGCT{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-sgct">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/">
            <i class="bi bi-diagram-3-fill me-2"></i>SGCT
        </a>
        <span class="navbar-text d-none d-md-inline">
            Semantic Guided Candidate Transformer
        </span>
    </div>
</nav>

<main class="flex-grow-1">
{% block content %}{% endblock %}
</main>

<footer class="py-3 text-center text-muted small border-top mt-auto" style="font-size:.72rem;">
    SGCT &middot; v0.1.0 &middot; Deterministic Multi-Source Candidate Fusion
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
